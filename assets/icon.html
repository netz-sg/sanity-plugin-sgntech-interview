
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>icon</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 300px;
        height: 300px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #0d0e12;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, sans-serif;
      }
      .glow {
        position: absolute;
        inset: -40%;
        background: radial-gradient(circle at 50% 40%, #ff5500 0%, transparent 58%);
        filter: blur(60px);
        opacity: 0.4;
      }
      .stack {
        position: relative;
        width: 214px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .turn {
        display: grid;
        grid-template-columns: 46px 1fr;
        gap: 14px;
        align-items: start;
      }
      .who {
        height: 9px;
        border-radius: 5px;
        margin-top: 3px;
        background: rgba(255, 255, 255, 0.32);
      }
      .turn.q .who {
        background: #ff5500;
      }
      .lines {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .lines i {
        display: block;
        height: 11px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.2);
      }
      .turn.q .lines i {
        background: rgba(255, 255, 255, 0.55);
      }
      .w80 {
        width: 80%;
      }
      .w55 {
        width: 55%;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="stack">
      <div class="turn q">
        <span class="who"></span>
        <span class="lines"><i></i><i class="w55"></i></span>
      </div>
      <div class="turn">
        <span class="who"></span>
        <span class="lines"><i></i><i class="w80"></i><i class="w55"></i></span>
      </div>
    </div>
  </body>
</html>
